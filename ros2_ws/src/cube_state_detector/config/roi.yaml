# One face captured at a time, straight-on. The cube body never moves in
# this rig (only individual faces spin, each on its own motor), and the
# cube is stickerless (no dark sticker border between cubies to detect —
# just a thin painted seam), so rather than seeing several faces at once
# from a fixed oblique angle, reposition a camera (or the cube) before
# each capture so exactly one face fills the frame, then call
# capture_position with that face's letter.
#
# image_topic can point at either camera_a or camera_b — assign however
# your physical setup actually uses the two cameras (e.g. one camera
# handheld and repositioned for all 6 faces, or two cameras each covering
# a subset without needing to move). Edit to match your rig.

positions:
  U:
    image_topic: /camera_a/color/image_raw
  R:
    image_topic: /camera_a/color/image_raw
  F:
    image_topic: /camera_a/color/image_raw
  D:
    image_topic: /camera_a/color/image_raw
  L:
    image_topic: /camera_a/color/image_raw
  B:
    image_topic: /camera_a/color/image_raw

# Face-square detection tuning. These almost certainly need adjusting for
# your lighting/cube/camera distance — use the debug image
# (/cube_state/debug_image/<face>) while tuning: it shows the
# perspective-corrected face with its 3x3 grid and classified colors once
# a face square is found, or the raw camera frame if none was found yet.
detection:
  blur_kernel: 5           # Gaussian blur kernel size before edge detection (odd)
  canny_low: 30            # Canny edge detector lower threshold
  canny_high: 90           # Canny edge detector upper threshold
  min_face_area: 100000    # px^2 - drop contours smaller than the whole face
  max_face_area: 3000000   # px^2 - drop contours bigger than the whole face
  aspect_ratio_tolerance: 0.6  # min(w,h)/max(w,h) - a face is ~square
  warp_size: 300           # px - size of the perspective-corrected square image
  sample_patch_radius: 8   # px around each grid cell's center to sample its color
